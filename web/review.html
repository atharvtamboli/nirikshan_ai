<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Evidence review · Nirikshan</title>
<style>
:root{--ink:#152b25;--muted:#4a6057;--line:#cad3c9;--paper:#f7f6ef;--green:#174a39;--ochre:#e9b755;font:100%/1.6 system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}header{background:var(--green);color:white;border-bottom:4px solid var(--ochre)}nav,main{max-width:72rem;margin:auto;padding:1rem clamp(1rem,5vw,4rem)}nav{display:flex;align-items:center;justify-content:space-between;gap:1rem}nav a{color:white;text-decoration:none}nav strong{font:700 1.65rem Georgia,serif}main{padding-top:clamp(2rem,6vw,5rem)}h1,h2,h3{font-family:Georgia,serif;line-height:1.12;margin:.5em 0}h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.055em}h2{font-size:2rem}h3{font-size:1.6rem}p{max-width:60ch}label{display:block;font-weight:650}input,textarea,button{font:inherit}button,input,textarea{border:1px solid var(--line);border-radius:.4rem;padding:.7rem 1rem}input,textarea{width:100%;background:white;color:var(--ink)}button{background:var(--green);color:white;font-weight:650;cursor:pointer;min-height:44px}button.alt{background:white;color:var(--green);border-color:var(--green)}button:disabled{opacity:.55;cursor:wait}.panel,article{background:#fffef9;border:1px solid var(--line);padding:clamp(1rem,4vw,2rem);border-radius:.7rem;margin:1.4rem 0}.auth{max-width:36rem}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:.75rem 0}.muted,small{color:var(--muted)}a{color:var(--green);text-underline-offset:.2em}:focus-visible{outline:3px solid #ac5600;outline-offset:3px}.skip{position:absolute;left:-100rem}.skip:focus{left:1rem;top:1rem;padding:.5rem;background:white}.meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}article{overflow-wrap:anywhere}#message{min-height:1.5em;font-weight:600}.url{display:block;margin-bottom:1rem}footer{margin:3rem 0 2rem;border-top:1px solid var(--line);padding:1rem 0;color:var(--muted)}
</style><script defer src="review.js"></script></head><body><a class="skip" href="#main">Skip to review queue</a>
<header><nav aria-label="Main navigation"><a href="./"><strong>Nirikshan</strong></a><a href="./">← Public explorer</a></nav></header>
<main id="main"><h1>Evidence review</h1><p>Check a submission against its source, confirm the project and amount, then record your decision.</p>
<form id="connect" class="panel auth"><label for="token">Reviewer access token</label><input type="password" id="token" required autocomplete="off" spellcheck="false"><div class="actions"><button>Open queue</button></div></form>
<div id="session" hidden><div class="actions"><button id="refresh" class="alt">Refresh queue</button><button id="lock" class="alt">Lock workspace</button></div><h2>Pending submissions</h2></div>
<p role="status" aria-live="polite" id="message"></p><section id="queue" aria-label="Pending submissions"></section>
<footer>Public works evidence desk · Nirikshan</footer></main></body></html>
